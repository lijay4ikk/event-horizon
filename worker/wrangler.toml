name = "event-horizon-form"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true
preview_urls = false

[vars]
# Сайты, с которых разрешено отправлять форму (через запятую)
ALLOWED_ORIGINS = "https://lijay4ikk.github.io,http://127.0.0.1:8765,http://localhost:8765"

# Не больше 5 заявок в минуту с одного IP
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Секреты задаются командами (в код не попадают):
#   npx wrangler@4 secret put BOT_TOKEN
#   npx wrangler@4 secret put CHAT_ID
